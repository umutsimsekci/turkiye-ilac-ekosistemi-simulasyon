[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmacoecosim"
version = "1.0.0"
description = "Reproducible illustrative pharmacoeconomic simulations for Türkiye's pharmaceutical ecosystem"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "pandas>=2.2,<4", "matplotlib>=3.9,<4", "plotly>=6,<8", "pillow>=10"]

[project.optional-dependencies]
app = ["streamlit>=1.55,<2"]
dev = ["pytest>=8,<10", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
pharmacoecosim = "pharmacoecosim.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
