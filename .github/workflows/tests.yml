name: Model ve arayüz doğrulaması
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[app,dev]"
      - run: python -m pytest -q
      - run: python -m pharmacoecosim.run --draws 1000 --no-visuals --out /tmp/pharmacoecosim-ci
